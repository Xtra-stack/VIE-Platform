name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Build Docker Images"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    environment:
      name: staging
      url: https://staging.vie-platform.com

    steps:
      - uses: actions/checkout@v3

      - name: Extract Image Tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            short_sha="${GITHUB_SHA:0:7}"
            tag="develop-${short_sha}"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Deploy to Staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd /opt/vie-staging
          docker-compose down
          docker pull vie-backend:${{ steps.extract_tag.outputs.tag }}
          docker pull vie-frontend:${{ steps.extract_tag.outputs.tag }}
          docker-compose up -d
          docker-compose exec -T backend npm run migrate
          EOF
        continue-on-error: true

      - name: Health Check Staging
        run: |
          sleep 10
          for i in {1..30}; do
            if curl -sf https://staging.vie-platform.com/health > /dev/null; then
              echo "Staging health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for staging to be healthy..."
            sleep 2
          done
          echo "Staging health check failed"
          exit 1
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: https://vie-platform.com

    steps:
      - uses: actions/checkout@v3

      - name: Extract Image Tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            short_sha="${GITHUB_SHA:0:7}"
            tag="main-${short_sha}"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Deploy to Production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          #!/bin/bash
          set -e
          
          # Backup current deployment
          cd /opt/vie-prod
          docker-compose exec -T backend npm run backup-db || true
          
          # Pull latest images and deploy
          docker pull vie-backend:${{ steps.extract_tag.outputs.tag }}
          docker pull vie-frontend:${{ steps.extract_tag.outputs.tag }}
          
          # Blue-green deployment
          docker-compose -f docker-compose.prod.yml down
          docker-compose -f docker-compose.prod.yml up -d
          docker-compose -f docker-compose.prod.yml exec -T backend npm run migrate
          EOF
        continue-on-error: false

      - name: Health Check Production
        run: |
          sleep 10
          for i in {1..30}; do
            if curl -sf https://vie-platform.com/health > /dev/null; then
              echo "Production health check passed"
              exit 0
            fi
            echo "Attempt $i/30 - waiting for production to be healthy..."
            sleep 2
          done
          echo "Production health check failed"
          exit 1

      - name: Rollback on Failure
        if: failure()
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd /opt/vie-prod
          docker-compose down
          docker-compose up -d
          EOF

      - name: Notify Deployment
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const status = context.payload.workflow_run?.conclusion || 'success';
            const message = `Production Deployment ${status === 'success' ? '✅' : '❌'}\n\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref }}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            }).catch(() => { /* ignore if not in PR context */ });
