name: Build Docker Images

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Tests & Linting"]
    types: [completed]
    branches: [main, develop]

jobs:
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v3

      - name: Extract Branch Name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Extract Image Tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            branch="${{ steps.extract_branch.outputs.branch }}"
            short_sha="${GITHUB_SHA:0:7}"
            tag="${branch}-${short_sha}"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vie-backend:${{ steps.extract_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload Backend Image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-${{ steps.extract_tag.outputs.tag }}
          path: /tmp/backend-image.tar
          retention-days: 1

  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v3

      - name: Extract Branch Name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Extract Image Tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            branch="${{ steps.extract_branch.outputs.branch }}"
            short_sha="${GITHUB_SHA:0:7}"
            tag="${branch}-${short_sha}"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
        id: extract_tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: vie-frontend:${{ steps.extract_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/frontend-image.tar

      - name: Upload Frontend Image
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image-${{ steps.extract_tag.outputs.tag }}
          path: /tmp/frontend-image.tar
          retention-days: 1

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Check SARIF
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "Vulnerability scan completed:"
            cat trivy-results.sarif | head -20
          fi
        continue-on-error: true
